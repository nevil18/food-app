name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'

  pull_request:
    branches: [main]
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: ap-south-1

  ECR_BACKEND: food-delivery-backend
  ECR_FRONTEND: food-delivery-frontend
  ECR_ADMIN: food-delivery-admin


jobs:

  # ============================================================
  # JOB 1: SONARQUBE
  # ============================================================

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


  # ============================================================
  # JOB 2: OWASP DEPENDENCY CHECK
  # ============================================================

  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: food-delivery-app
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 7
            --enableRetired
            --disableAssembly

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: reports/


  # ============================================================
  # JOB 3: DETECT CHANGED SERVICES
  # ============================================================

  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}

    steps:

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |

            backend:
              - 'backend/**'

            frontend:
              - 'frontend/**'

            admin:
              - 'admin/**'


  # ============================================================
  # JOB 4: BACKEND
  # BUILD → TRIVY → ECR
  # ============================================================

  backend:
    name: Backend Build + Trivy + ECR
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - owasp
      - changes

    if: needs.changes.outputs.backend == 'true'

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Generate image tag
      # ----------------------------------------------------------

      - name: Generate image tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Build backend image
      # ----------------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t food-backend:${GITHUB_SHA} \
            backend/


      # ----------------------------------------------------------
      # Trivy scan
      # ----------------------------------------------------------

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: food-backend:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Tag backend image
      # ----------------------------------------------------------

      - name: Tag backend image for ECR
        if: github.event_name == 'push'
        run: |
          docker tag \
            food-backend:${{ steps.tag.outputs.tag }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}


      # ----------------------------------------------------------
      # Push backend
      # ----------------------------------------------------------

      - name: Push backend image to ECR
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}


  # ============================================================
  # JOB 5: FRONTEND
  # BUILD → TRIVY → ECR
  # ============================================================

  frontend:
    name: Frontend Build + Trivy + ECR
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - owasp
      - changes

    if: needs.changes.outputs.frontend == 'true'

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Generate image tag
      # ----------------------------------------------------------

      - name: Generate image tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Build frontend image
      # ----------------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            -t food-frontend:${GITHUB_SHA} \
            frontend/


      # ----------------------------------------------------------
      # Trivy scan
      # ----------------------------------------------------------

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: food-frontend:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Tag frontend image
      # ----------------------------------------------------------

      - name: Tag frontend image for ECR
        if: github.event_name == 'push'
        run: |
          docker tag \
            food-frontend:${{ steps.tag.outputs.tag }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}


      # ----------------------------------------------------------
      # Push frontend
      # ----------------------------------------------------------

      - name: Push frontend image to ECR
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}


  # ============================================================
  # JOB 6: ADMIN
  # BUILD → TRIVY → ECR
  # ============================================================

  admin:
    name: Admin Build + Trivy + ECR
    runs-on: ubuntu-latest

    needs:
      - sonarqube
      - owasp
      - changes

    if: needs.changes.outputs.admin == 'true'

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Generate image tag
      # ----------------------------------------------------------

      - name: Generate image tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Build admin image
      # ----------------------------------------------------------

      - name: Build admin Docker image
        run: |
          docker build \
            -t food-admin:${GITHUB_SHA} \
            admin/


      # ----------------------------------------------------------
      # Trivy scan
      # ----------------------------------------------------------

      - name: Trivy scan admin
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: food-admin:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Tag admin image
      # ----------------------------------------------------------

      - name: Tag admin image for ECR
        if: github.event_name == 'push'
        run: |
          docker tag \
            food-admin:${{ steps.tag.outputs.tag }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_ADMIN }}:${{ steps.tag.outputs.tag }}


      # ----------------------------------------------------------
      # Push admin
      # ----------------------------------------------------------

      - name: Push admin image to ECR
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_ADMIN }}:${{ steps.tag.outputs.tag }}


  # ============================================================
  # JOB 7: UPDATE KUBERNETES MANIFESTS
  # ============================================================

  update-k8s:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest

    needs:
      - changes
      - backend
      - frontend
      - admin

    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&

      (
        needs.changes.outputs.backend != 'true' ||
        needs.backend.result == 'success'
      ) &&

      (
        needs.changes.outputs.frontend != 'true' ||
        needs.frontend.result == 'success'
      ) &&

      (
        needs.changes.outputs.admin != 'true' ||
        needs.admin.result == 'success'
      ) &&

      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.admin == 'true'
      )

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # Update only changed services
      # ----------------------------------------------------------

      - name: Update Kubernetes image tags
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ env.AWS_REGION }}

          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          ADMIN_CHANGED: ${{ needs.changes.outputs.admin }}

          BACKEND_TAG: ${{ needs.backend.outputs.image-tag }}
          FRONTEND_TAG: ${{ needs.frontend.outputs.image-tag }}
          ADMIN_TAG: ${{ needs.admin.outputs.image-tag }}

        run: |

          # ======================================================
          # BACKEND
          # ======================================================

          if [ "$BACKEND_CHANGED" = "true" ]; then

            echo "Updating backend Kubernetes image..."

            sed -i \
              "s|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-backend:.*|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-backend:$BACKEND_TAG|" \
              k8s/backend_deployment.yml

          fi


          # ======================================================
          # FRONTEND
          # ======================================================

          if [ "$FRONTEND_CHANGED" = "true" ]; then

            echo "Updating frontend Kubernetes image..."

            sed -i \
              "s|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-frontend:.*|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-frontend:$FRONTEND_TAG|" \
              k8s/frontend_deployment.yml

          fi


          # ======================================================
          # ADMIN
          # ======================================================

          if [ "$ADMIN_CHANGED" = "true" ]; then

            echo "Updating admin Kubernetes image..."

            sed -i \
              "s|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-admin:.*|image: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/food-delivery-admin:$ADMIN_TAG|" \
              k8s/admin_deployment.yml

          fi


      # ----------------------------------------------------------
      # Commit changes
      # ----------------------------------------------------------

      - name: Commit Kubernetes changes
        run: |

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add k8s/

          if git diff --staged --quiet; then

            echo "No Kubernetes manifest changes."

          else

            git commit \
              -m "ci: update image tags to ${GITHUB_SHA}"

            git push

          fi
