apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        ci.github.com/revision: db1a53553634bf02220e06a33a59a0b2dcc03043
    spec:
      containers:
        - name: backend
          image: 841702866815.dkr.ecr.ap-south-1.amazonaws.com/food-delivery-backend:db1a53553634bf02220e06a33a59a0b2dcc03043
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
