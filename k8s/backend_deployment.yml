apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        ci.github.com/revision: f9fbba96e0d227ea9682df115b67c6ca3e7ca4ab
    spec:
      containers:
        - name: backend
          image: 841702866815.dkr.ecr.ap-south-1.amazonaws.com/food-delivery-backend:f9fbba96e0d227ea9682df115b67c6ca3e7ca4ab
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
