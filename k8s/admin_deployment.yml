apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        ci.github.com/revision: 15604e1a43bc55770b1bada405f7f507c08e9583
    spec:
      containers:
        - name: admin
          image: 841702866815.dkr.ecr.ap-south-1.amazonaws.com/food-delivery-admin:15604e1a43bc55770b1bada405f7f507c08e9583
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
