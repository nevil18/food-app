apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        ci.github.com/revision: 9e96ff115a7eee53e0b76aadfb5a7da5679d797c
    spec:
      containers:
        - name: frontend
          image: 841702866815.dkr.ecr.ap-south-1.amazonaws.com/food-delivery-frontend:9e96ff115a7eee53e0b76aadfb5a7da5679d797c
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
