apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        ci.github.com/revision: a926ad3d3c9cd97bbda9bf3181c2704600bf6015
    spec:
      containers:
        - name: frontend
          image: 841702866815.dkr.ecr.ap-south-1.amazonaws.com/food-delivery-frontend:a926ad3d3c9cd97bbda9bf3181c2704600bf6015
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
