---
# Replaces monitoring/monitoring-setup.sh (Prometheus + Grafana).
# Does not depend on DNS to install, so it can run any time after cluster_setup.yml.
# The HTTPS certificate for grafana/prometheus only issues once the DNS CNAMEs
# point to the ingress-nginx load balancer.
- name: Monitoring setup (Prometheus + Grafana)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../eks-setup/vars.yml

  vars:
    # Empty = schedule monitoring pods on any node.
    # If you create the separate "monitoring" NodePool, set this to:
    #   monitoring_node_selector: { workload: monitoring }
    monitoring_node_selector: {}

  tasks:
    # ─── Step 1: Helm ──────────────────────────────────────
    - name: Check if helm is installed
      ansible.builtin.command: which helm
      register: helm_check
      changed_when: false
      failed_when: false

    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: "0700"
      when: helm_check.rc != 0

    - name: Install Helm
      ansible.builtin.command: /tmp/get_helm.sh
      become: true
      when: helm_check.rc != 0

    # ─── Step 2: Helm repo ─────────────────────────────────
    - name: Add prometheus-community repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    # ─── Steps 3 and 4: Namespace + chart ──────────────────
    # Same settings as before, plus (added after the Oct 22 Grafana 503 incident):
    #  - requests/limits on every monitoring pod, so none of them is BestEffort
    #    and the kubelet/scheduler can protect them when the node is busy
    #  - karpenter.sh/do-not-disrupt on Grafana and Prometheus, so Auto Mode
    #    consolidation does not try to replace the node under them
    #    (their data is on emptyDir and is lost when the pod moves)
    # Probe settings are unchanged on purpose until the root cause is proven.
    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: stable
        chart_ref: prometheus-community/kube-prometheus-stack
        # Pinned so a re-run does not silently upgrade the chart.
        # Check what you run with: helm -n prometheus list
        chart_version: "92.11.0"
        release_namespace: prometheus
        create_namespace: true
        update_repo_cache: true
        wait: false
        values:
          alertmanager:
            enabled: false
          prometheusOperator:
            nodeSelector: "{{ monitoring_node_selector }}"
            admissionWebhooks:
              enabled: false
            tls:
              enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 256Mi
            livenessProbe:
              timeoutSeconds: 10
              failureThreshold: 5
            readinessProbe:
              timeoutSeconds: 10
              failureThreshold: 5
          prometheus:
            prometheusSpec:
              nodeSelector: "{{ monitoring_node_selector }}"
              retention: 3d
              resources:
                # No memory limit on purpose: real usage has not been measured
                # yet and an OOM kill here would be worse than the problem.
                requests:
                  cpu: 200m
                  memory: 600Mi
              podMetadata:
                annotations:
                  karpenter.sh/do-not-disrupt: "true"
          kube-state-metrics:
            nodeSelector: "{{ monitoring_node_selector }}"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            livenessProbe:
              timeoutSeconds: 10
              failureThreshold: 5
            readinessProbe:
              timeoutSeconds: 10
              failureThreshold: 5
          grafana:
            nodeSelector: "{{ monitoring_node_selector }}"
            resources:
              requests:
                cpu: 200m
                memory: 384Mi
              limits:
                memory: 768Mi
            podAnnotations:
              karpenter.sh/do-not-disrupt: "true"
            sidecar:
              resources:
                requests:
                  cpu: 20m
                  memory: 48Mi
                limits:
                  memory: 192Mi
            livenessProbe:
              initialDelaySeconds: 120
              failureThreshold: 15
            readinessProbe:
              initialDelaySeconds: 90
              failureThreshold: 15
          prometheus-node-exporter:
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
            livenessProbe:
              timeoutSeconds: 10
              failureThreshold: 5
            readinessProbe:
              timeoutSeconds: 10
              failureThreshold: 5

    # ─── Step 5: Wait for operator, Prometheus and Grafana ──
    - name: Wait for Prometheus operator
      ansible.builtin.command: >
        kubectl wait --namespace prometheus --for=condition=ready pod
        --selector=app=kube-prometheus-stack-operator --timeout=180s
      register: wait_operator
      retries: 3
      delay: 10
      until: wait_operator.rc == 0
      changed_when: false

    # The Prometheus pod is created by the operator, so it appears a bit later.
    - name: Wait for Prometheus pod
      ansible.builtin.command: >
        kubectl wait --namespace prometheus --for=condition=ready pod
        --selector=app.kubernetes.io/name=prometheus --timeout=180s
      register: wait_prom
      retries: 6
      delay: 15
      until: wait_prom.rc == 0
      changed_when: false

    # rollout status waits for the NEW Grafana pod only. (kubectl wait on a
    # label selector also waits for an old pod that may be stuck terminating.)
    - name: Wait for Grafana rollout
      ansible.builtin.command: >
        kubectl rollout status deployment/stable-grafana
        --namespace prometheus --timeout=300s
      register: wait_grafana
      changed_when: false
      failed_when: false

    - name: Warn if Grafana is not ready yet
      ansible.builtin.debug:
        msg: "Grafana is not ready yet. Check: kubectl get pods -n prometheus"
      when: wait_grafana.rc != 0

    # ─── Step 5b: Public HTTPS ingress ─────────────────────
    # cert-manager sees the cluster-issuer annotation and issues "monitoring-tls".
    # Without this task the ingress controller serves its fake certificate
    # (ERR_CERT_AUTHORITY_INVALID in the browser).
    - name: Apply monitoring ingress (TLS)
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/monitoring-ingress.yml"

    # Non-fatal: the certificate needs DNS to point at the load balancer first.
    - name: Wait for monitoring TLS certificate
      ansible.builtin.command: >
        kubectl wait --namespace prometheus --for=condition=Ready
        certificate/monitoring-tls --timeout=180s
      register: wait_cert
      changed_when: false
      failed_when: false

    - name: Warn if certificate is not ready yet
      ansible.builtin.debug:
        msg:
          - "monitoring-tls is not Ready yet. Most likely DNS: grafana/prometheus CNAMEs must point to the ingress-nginx load balancer."
          - "Check: kubectl -n ingress-nginx get svc ; nslookup grafana.nevilanghan.me 8.8.8.8"
          - "Debug: kubectl -n prometheus describe certificate monitoring-tls ; kubectl -n prometheus describe challenge"
      when: wait_cert.rc != 0

    # ─── Step 6: Verify ────────────────────────────────────
    - name: List monitoring pods and services
      ansible.builtin.command: "{{ item }}"
      loop:
        - kubectl get pods -n prometheus
        - kubectl get svc -n prometheus
        - kubectl get ingress,certificate -n prometheus
      register: mon
      changed_when: false

    - name: Show monitoring status
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ mon.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ─── Step 7: Grafana password ──────────────────────────
    - name: Read Grafana admin secret
      kubernetes.core.k8s_info:
        kind: Secret
        name: stable-grafana
        namespace: prometheus
      register: grafana_secret
      tags: [show_summary]

    - name: Decode Grafana password
      ansible.builtin.set_fact:
        grafana_password: "{{ grafana_secret.resources[0].data['admin-password'] | b64decode }}"
      when: grafana_secret.resources | length > 0
      no_log: true
      tags: [show_summary]

    # ─── Steps 8 and 9: Port-forwards (restart automatically) ──
    # pgrep runs as its own command (not inside a shell string), otherwise
    # it would match its own command line and always report "running".
    - name: Check Grafana port-forward
      ansible.builtin.command: pgrep -f "kubectl port-forward.*stable-grafana"
      register: pf_grafana
      changed_when: false
      failed_when: false

    - name: Start Grafana port-forward
      ansible.builtin.shell: |
        setsid nohup bash -c 'while true; do kubectl port-forward svc/stable-grafana -n prometheus 3000:80 --address 0.0.0.0; sleep 2; done' \
          > /tmp/grafana-port-forward.log 2>&1 < /dev/null &
      when: pf_grafana.rc != 0

    - name: Check Prometheus port-forward
      ansible.builtin.command: pgrep -f "kubectl port-forward.*stable-kube-prometheus-sta-prometheus"
      register: pf_prom
      changed_when: false
      failed_when: false

    - name: Start Prometheus port-forward
      ansible.builtin.shell: |
        setsid nohup bash -c 'while true; do kubectl port-forward svc/stable-kube-prometheus-sta-prometheus -n prometheus 9090:9090 --address 0.0.0.0; sleep 2; done' \
          > /tmp/prometheus-port-forward.log 2>&1 < /dev/null &
      when: pf_prom.rc != 0

    # ─── Step 10: Public IP of THIS server (the master node) ──
    # The port-forwards listen on this server, so this is the address
    # you open in the browser. The pods themselves only have private IPs.
    - name: Get server public IP
      ansible.builtin.command: curl -s --max-time 5 ifconfig.me
      register: public_ip
      changed_when: false
      failed_when: false
      tags: [show_summary]

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Grafana (HTTPS)    : https://grafana.nevilanghan.me"
          - "Prometheus (HTTPS) : https://prometheus.nevilanghan.me  (no login, consider removing or protecting it)"
          - "Grafana (forward)  : http://{{ public_ip.stdout | default('<MASTER_PUBLIC_IP>', true) }}:3000"
          - "Prometheus (forward): http://{{ public_ip.stdout | default('<MASTER_PUBLIC_IP>', true) }}:9090"
          - "Username   : admin"
          - "Password   : {{ grafana_password | default('(not found)') }}"
          - "Allow ports 3000 and 9090 in the server Security Group (your IP only)."
          - "Port-forward logs: /tmp/grafana-port-forward.log, /tmp/prometheus-port-forward.log"
      tags: [show_summary]
